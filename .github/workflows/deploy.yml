name: Build and deploy Astro

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redesign
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up content parser
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: redesign
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: redesign/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Build and validate the release
        run: npm run validate
      - name: Upload validated static site
        uses: actions/upload-artifact@v7
        with:
          name: astro-site
          path: redesign/dist
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    # PRs and manual runs on preview branches only build and validate.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download validated static site
        uses: actions/download-artifact@v8
        with:
          name: astro-site
          path: public-site
      - name: Publish to the existing Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public-site
          clean: true

