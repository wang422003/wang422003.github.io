- title: Experience
  type: time_table
  contents:
    - title: Researcher
      institution: Shanghai AI Laboratory, Shanghai, China
      year: May 2025 - Present
      description:
        - Conduct research in AI for Science, focusing on multimodal models and scientific reasoning.
        - Investigate equation discovery, visual-to-symbolic reasoning, and structural inference of dynamical systems.
        - Contribute to scientific foundation models, native structural reasoning, and physics reasoning benchmarks.
    - title: Graduate Assistant for Autonomous Driving
      institution: Karlsruhe Institute of Technology, Germany
      year: 2020 
      description:
        - Engineered an innovative visual localization technique using Graph Neural Networks and OpenCV to enhance the precision of monocular camera-based navigation in autonomous vehicles.
        - Successfully presented and published the outcomes of the visual localization research in a peer-reviewed conference.
        - Investigated combinatorial approaches to hierarchical visual localization, broadening the scope of research and uncovering potential advancements in the domain.
    - title: Research Intern
      institution: Robert Bosch GmbH, Renningen, Germany
      year: 2018
      description:
        - Organized and delivered a tutorial on AUTOSAR for the research team, initiated communication with the director.
        - Pioneered the development of a diagnosis system using an extended Kalman filter for an autonomous electric vehicle prototype’s electric propulsion system.
        - Explored the integration of modern AI methods into self-driving cars for diagnostic purposes.


- title: Projects
  type: time_table
  contents:
    - title: Multimodal Models and Scientific Reasoning
      year: 2025 - Present
      description:
        - Research on scientific multimodal foundation models and native structural reasoning across scientific domains.
        - Visual-to-symbolic discovery of physical laws with VIPER-R1.
        - Physics reasoning evaluation with PhysUniBench and scientific instruction following with SciIF.
    - title: Structural Inference (AI4Science)
      year: 2020 - Present
      description:
        - Structural inference of dynamical systems from observational trajectories.
        - Methods that handle irregular sampling, incomplete observations, and partial prior knowledge.
        - Developed StructInfer, an open benchmark for evaluating structural inference methods across disciplines.
        - Research includes SICSM, SGSI, and generative flow network approaches to structural inference.
    - title: AI4EDU
      year: 2024 - Present
      description:
        - Developed models for recommendation systems using spatio-temporal graphs, enhancing them with integrated database solutions.
        - Innovated techniques for addressing missing data issues by leveraging spatio-temporal similarities.
        - Launched the LLM4EDUKG benchmark, assessing the reasoning capabilities of pre-trained large language models on domain-specific knowledge graphs.

